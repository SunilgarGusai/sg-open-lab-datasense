name: Foundation validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Temporary npm install: lockfile must be generated when registry access is available.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run validate
  python-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5'
      - run: python scripts/generate_numpy_oracle.py --verify
